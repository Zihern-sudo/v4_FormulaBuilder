<!--
/**
 * @Author      WDCi ()
 * @Date        April 2026
 * @group       Formula Builder
 * @Description HTML template for the formulaBuilder LWC.
 *
 *              Structure (top to bottom):
 *                1. c-js-library-loader   — team convention; loads any ext. libs
 *                2. Spinner               — shown while isLoading is true
 *                3. Main card             — gated on isInitSuccess
 *                   a. VIEW MODE   (if:false={isEditMode})
 *                      - field label (left) + <pre> formula value (right)
 *                      - Header: Edit (if allowEdit+isConfigured), Verify Formula,
 *                        Refresh icon
 *                   b. EDIT MODE   (if:true={isEditMode})
 *                      - lightning-layout row: System Variables | Fields |
 *                        Functions | Operators comboboxes
 *                      - formulaTargetLabel (muted sub-heading)
 *                      - lightning-textarea (rows=10, onchange)
 *                      - Header: Update (brand), Cancel (neutral), Refresh icon
 *                4. Verify Formula modal   — gated on isVerifyModalOpen
 *                   - lightning-record-picker for sample record selection
 *                   - "Verify" button  → handleVerifyRecord
 *                   - Result block: green success OR red error message
 *                   - "Close" button
 *
 * @changehistory
 * ISS-002768 2026-04-03 - Initial development of Formula Builder LWC template
 */
-->
<template>

    <!-- ═══════════════════════════════════════════════════════════════════════
         1. JS Library Loader  (team convention — placed before any rendered UI)
         ═══════════════════════════════════════════════════════════════════ -->
    <c-js-library-loader></c-js-library-loader>

    <!-- ═══════════════════════════════════════════════════════════════════════
         2. Spinner  — outside isInitSuccess so it shows during init phase too
         ═══════════════════════════════════════════════════════════════════ -->
    <template if:true={isLoading}>
        <div class="formula-builder-spinner-container">
            <lightning-spinner
                alternative-text="Loading"
                size="medium"
                class="formula-builder-spinner">
            </lightning-spinner>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════════════════════════════════
         3. Main content  — gated until connectedCallback marks _initComplete
         ═══════════════════════════════════════════════════════════════════ -->
    <template if:true={isInitSuccess}>
        <div class="formula-builder-wrapper">
            <lightning-card
                title={cardTitle}
                icon-name="utility:formula"
                class="formula-builder-card">

                <!-- ── Card header: action buttons (mode-aware) ───────────── -->
                <div slot="actions" class="formula-builder-header-actions">

                    <!-- VIEW MODE actions -->
                    <template if:false={isEditMode}>

                        <!-- Edit button — only when allowEdit AND isConfigured -->
                        <template if:true={showEditButton}>
                            <lightning-button
                                label="Edit"
                                variant="brand"
                                icon-name="utility:edit"
                                icon-position="left"
                                title="Edit the formula"
                                onclick={handleEditOnclick}
                                disabled={isLoading}
                                class="formula-builder-btn-edit slds-m-right_xx-small">
                            </lightning-button>
                        </template>

                        <!-- Verify Formula — always visible in view mode -->
                        <lightning-button
                            label="Verify Formula"
                            variant="neutral"
                            icon-name="utility:check"
                            icon-position="left"
                            title="Verify formula syntax against a sample record"
                            onclick={handleVerifyOnclick}
                            disabled={isLoading}
                            class="formula-builder-btn-verify slds-m-right_xx-small">
                        </lightning-button>

                        <!-- Refresh icon button -->
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            variant="border-filled"
                            alternative-text="Refresh"
                            title="Refresh formula value from record"
                            onclick={handleRefresh}
                            disabled={isLoading}
                            class="formula-builder-btn-refresh">
                        </lightning-button-icon>

                    </template>
                    <!-- /VIEW MODE actions -->

                    <!-- EDIT MODE actions -->
                    <template if:true={isEditMode}>

                        <lightning-button
                            label="Update"
                            variant="brand"
                            icon-name="utility:save"
                            icon-position="left"
                            title="Save the formula to the record"
                            onclick={handleUpdateOnclick}
                            disabled={isLoading}
                            class="formula-builder-btn-update slds-m-right_xx-small">
                        </lightning-button>

                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            icon-name="utility:close"
                            icon-position="left"
                            title="Discard changes and return to view mode"
                            onclick={handleCancelOnclick}
                            disabled={isLoading}
                            class="formula-builder-btn-cancel slds-m-right_xx-small">
                        </lightning-button>

                        <!-- Refresh icon button -->
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            variant="border-filled"
                            alternative-text="Refresh"
                            title="Reload formula value from record"
                            onclick={handleRefresh}
                            disabled={isLoading}
                            class="formula-builder-btn-refresh">
                        </lightning-button-icon>

                    </template>
                    <!-- /EDIT MODE actions -->

                </div>
                <!-- /slot:actions -->

                <!-- ── Card body ──────────────────────────────────────────── -->
                <div class="formula-builder-content slds-p-around_medium">

                    <!-- ══════════════════════════════════════════════════════
                         VIEW MODE  (isEditMode = false)
                         ════════════════════════════════════════════════════ -->
                    <template if:false={isEditMode}>
                        <div class="formula-builder-view">

                            <!-- Configured: label + formula value -->
                            <template if:true={isConfigured}>
                                <div class="formula-builder-view__row slds-grid slds-grid_vertical-align-start slds-wrap">

                                    <!-- Left column: field label -->
                                    <div class="formula-builder-view__label-col
                                                slds-col slds-size_2-of-12 slds-small-size_12-of-12">
                                        <span class="formula-builder-view__label
                                                     slds-text-body_small slds-text-color_weak">
                                            {fieldLabel}
                                        </span>
                                    </div>

                                    <!-- Right column: formula value in preformatted block -->
                                    <div class="formula-builder-view__formula-col
                                                slds-col slds-size_10-of-12 slds-small-size_12-of-12">
                                        <pre class="formula-builder-view__pre">{currentFormulaValue}</pre>
                                    </div>

                                </div>
                            </template>
                            <!-- /isConfigured -->

                            <!-- Not configured: configuration hint -->
                            <template if:false={isConfigured}>
                                <p class="formula-builder-view__hint
                                          slds-text-body_small slds-text-color_weak">
                                    Set <strong>targetObjectApiName</strong> and
                                    <strong>targetFieldApiName</strong> to load a formula.
                                </p>
                            </template>

                        </div>
                    </template>
                    <!-- /VIEW MODE -->

                    <!-- ══════════════════════════════════════════════════════
                         EDIT MODE  (isEditMode = true)
                         ════════════════════════════════════════════════════ -->
                    <template if:true={isEditMode}>
                        <div class="formula-builder-edit">

                            <!-- ── Row 1: Four insertion comboboxes ────────── -->
                            <div class="formula-builder-combobox-row slds-m-bottom_small">
                                <lightning-layout
                                    multiple-rows="false"
                                    pull-to-boundary="small"
                                    class="formula-builder-combobox-layout">

                                    <!-- Combobox 1: System Variables -->
                                    <lightning-layout-item
                                        flexibility="auto"
                                        padding="around-small"
                                        class="formula-builder-combobox-item">
                                        <lightning-combobox
                                            label="System Variables"
                                            variant="label-stacked"
                                            placeholder="Select an Option"
                                            options={systemVariableOptions}
                                            value={_selectedSystemVariable}
                                            onchange={handleSystemVariableSelect}
                                            disabled={isLoading}
                                            class="formula-builder-combobox">
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <!-- Combobox 2: Fields (only if isConfigured) -->
                                    <template if:true={isConfigured}>
                                        <lightning-layout-item
                                            flexibility="auto"
                                            padding="around-small"
                                            class="formula-builder-combobox-item">
                                            <lightning-combobox
                                                label="Fields"
                                                variant="label-stacked"
                                                placeholder="Select an Option"
                                                options={fieldOptions}
                                                value={_selectedField}
                                                onchange={handleFieldSelect}
                                                disabled={isLoading}
                                                class="formula-builder-combobox">
                                            </lightning-combobox>
                                        </lightning-layout-item>
                                    </template>

                                    <!-- Combobox 3: Functions -->
                                    <lightning-layout-item
                                        flexibility="auto"
                                        padding="around-small"
                                        class="formula-builder-combobox-item">
                                        <lightning-combobox
                                            label="Functions"
                                            variant="label-stacked"
                                            placeholder="Select an Option"
                                            options={functionOptions}
                                            value={_selectedFunction}
                                            onchange={handleFunctionSelect}
                                            disabled={isLoading}
                                            class="formula-builder-combobox">
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <!-- Combobox 4: Operators -->
                                    <lightning-layout-item
                                        flexibility="auto"
                                        padding="around-small"
                                        class="formula-builder-combobox-item">
                                        <lightning-combobox
                                            label="Operators"
                                            variant="label-stacked"
                                            placeholder="Select an Option"
                                            options={operatorOptions}
                                            value={_selectedOperator}
                                            onchange={handleOperatorSelect}
                                            disabled={isLoading}
                                            class="formula-builder-combobox">
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                </lightning-layout>
                            </div>
                            <!-- /combobox row -->

                            <!-- ── Row 2: Formula target label ─────────────── -->
                            <p class="formula-builder-target-label
                                      slds-text-body_small slds-text-color_weak
                                      slds-m-bottom_xx-small">
                                {formulaTargetLabel}
                            </p>

                            <!-- ── Row 3: Formula textarea ─────────────────── -->
                            <lightning-textarea
                                data-id="formulaTextarea"
                                label="Formula Editor"
                                variant="label-hidden"
                                value={currentFormulaValue}
                                onchange={handleFormulaChange}
                                rows="10"
                                placeholder="Enter or build your formula here…"
                                disabled={isLoading}
                                class="formula-builder-textarea">
                            </lightning-textarea>

                        </div>
                    </template>
                    <!-- /EDIT MODE -->

                </div>
                <!-- /formula-builder-content -->

            </lightning-card>
        </div>
    </template>
    <!-- /isInitSuccess -->

    <!-- ═══════════════════════════════════════════════════════════════════════
         4. Verify Formula modal
            Rendered outside the card so it overlays the full viewport.
            Opened by handleVerifyOnclick; closed by handleVerifyClose.
         ═══════════════════════════════════════════════════════════════════ -->
    <template if:true={isVerifyModalOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="formula-builder-modal-heading"
            class="slds-modal slds-fade-in-open formula-builder-modal">

            <div class="slds-modal__container formula-builder-modal__container">

                <!-- Modal header ─────────────────────────────────────────── -->
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close
                               slds-button_icon-inverse formula-builder-modal__close"
                        title="Close"
                        onclick={handleVerifyClose}>
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            alternative-text="Close modal">
                        </lightning-icon>
                    </button>
                    <h2
                        id="formula-builder-modal-heading"
                        class="slds-modal__title slds-hyphenate">
                        Verify Formula
                    </h2>
                </header>

                <!-- Modal body ───────────────────────────────────────────── -->
                <div class="slds-modal__content slds-p-around_medium
                            formula-builder-modal__body">

                    <!-- Hint text -->
                    <p class="formula-builder-modal__hint
                              slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                        Optionally paste a sample record Id to include context in the check.
                        Syntax is always validated — the formula result is <em>not</em> evaluated.
                    </p>

                    <!-- Text input: stores typed record Id in _verifyRecordId -->
                    <lightning-input
                        type="text"
                        label="Sample Record ID (optional)"
                        placeholder="e.g. a0B000000000001EAA"
                        value={_verifyRecordId}
                        onchange={handleVerifyRecordInput}
                        disabled={isLoading}
                        class="formula-builder-modal__record-input">
                    </lightning-input>

                    <!-- Verify button — calls handleVerifyRecord (button click) -->
                    <div class="formula-builder-modal__verify-action slds-m-top_medium">
                        <lightning-button
                            label="Verify"
                            variant="brand"
                            icon-name="utility:check"
                            icon-position="left"
                            title="Run formula syntax verification"
                            onclick={handleVerifyRecord}
                            disabled={isLoading}
                            class="formula-builder-btn-verify-modal">
                        </lightning-button>
                    </div>

                    <!-- ── Result area (shown after verification runs) ─────── -->
                    <template if:true={hasVerifyModalResult}>
                        <div class="formula-builder-modal__result slds-m-top_medium">

                            <!-- Success: isValid = true -->
                            <template if:true={verifyModalIsValid}>
                                <div class="formula-builder-result formula-builder-result--success
                                            slds-box slds-p-around_small">
                                    <lightning-icon
                                        icon-name="utility:success"
                                        size="x-small"
                                        alternative-text="Valid"
                                        class="formula-builder-result__icon slds-m-right_x-small">
                                    </lightning-icon>
                                    <span class="formula-builder-result__text slds-text-color_success">
                                        Formula syntax is valid.
                                    </span>
                                </div>
                            </template>

                            <!-- Error: isValid = false -->
                            <template if:true={verifyModalIsInvalid}>
                                <div class="formula-builder-result formula-builder-result--error
                                            slds-box slds-p-around_small">
                                    <lightning-icon
                                        icon-name="utility:error"
                                        size="x-small"
                                        alternative-text="Invalid"
                                        class="formula-builder-result__icon slds-m-right_x-small">
                                    </lightning-icon>
                                    <span class="formula-builder-result__text slds-text-color_error">
                                        {verifyModalResultMessage}
                                    </span>
                                </div>
                            </template>

                        </div>
                    </template>
                    <!-- /result area -->

                </div>
                <!-- /modal body -->

                <!-- Modal footer ─────────────────────────────────────────── -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        variant="neutral"
                        onclick={handleVerifyClose}
                        class="formula-builder-btn-modal-close">
                    </lightning-button>
                </footer>

            </div>
            <!-- /slds-modal__container -->

        </section>

        <!-- SLDS backdrop darkens the page behind the modal -->
        <div class="slds-backdrop slds-backdrop_open formula-builder-backdrop"></div>

    </template>
    <!-- /isVerifyModalOpen -->

</template>
