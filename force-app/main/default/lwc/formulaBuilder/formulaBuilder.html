<!--
/**
 * @Author      WDCi (Zihern)
 * @Date        April 2026
 * @group       Formula Builder
 * @Description HTML template for the formulaBuilder LWC.
 *
 *              Structure (top to bottom):
 *                1. c-js-library-loader   — team convention; loads any ext. libs
 *                2. Spinner               — shown while isLoading is true
 *                3. Main card             — gated on isInitSuccess
 *                   a. VIEW MODE   (if:false={isEditMode})
 *                      - field label (left) + <pre> formula value (right)
 *                      - Header: Edit (if allowEdit+isConfigured), Refresh icon
 *                   b. EDIT MODE   (if:true={isEditMode})
 *                      - lightning-layout row: Formula Context | Fields |
 *                        Functions | Operators comboboxes
 *                      - Unified two-step indicator (hasPendingSystemVariable):
 *                        Step 1 text or token preview with Insert button
 *                      - formulaTargetLabel (muted sub-heading)
 *                      - lightning-textarea (rows=10, onchange)
 *                      - Header: Update (brand), Cancel (neutral),
 *                        Verify Formula, Refresh icon
 *                4. Verify Formula modal  — gated on isVerifyModalOpen
 *
 * @changehistory
 * ISS-002768 2026-04-03 - Initial development of Formula Builder LWC template
 * ISS-002768 2026-04-06 - Verify Formula modal; verification opt-in; explicit Verify button
 * ISS-002768 2026-04-08 - Unified two-step indicator; Formula Context combobox label
 */
-->
<template>
  <c-js-library-loader></c-js-library-loader>

  <!-- Root container — position:relative so the spinner overlay is scoped
       to the component and never covers the rest of the page. -->
  <div class="formula-builder-root">

    <!-- Spinner — position:absolute inside formula-builder-root so it
         covers only this component, not the whole viewport. -->
    <template if:true={isLoading}>
      <div class="formula-builder-spinner-container">
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
          class="formula-builder-spinner"
        >
        </lightning-spinner>
      </div>
    </template>

    <!-- Main content — gated until connectedCallback marks _initComplete -->
    <template if:true={isInitSuccess}>
      <div class="formula-builder-wrapper">
        <lightning-card
          title={cardTitle}
          icon-name="utility:edit"
          class="formula-builder-card"
        >
          <!-- ── Card header: action buttons (mode-aware) ───────────── -->
          <div slot="actions" class="formula-builder-header-actions">

            <!-- VIEW MODE actions -->
            <template if:false={isEditMode}>
              <template if:true={showEditButton}>
                <lightning-button
                  label="Edit"
                  variant="brand"
                  icon-name="utility:edit"
                  icon-position="left"
                  title="Edit the formula"
                  onclick={handleEditOnclick}
                  disabled={isLoading}
                  class="formula-builder-btn-edit slds-m-right_xx-small"
                >
                </lightning-button>
              </template>
            </template>

            <!-- EDIT MODE actions -->
            <template if:true={isEditMode}>
              <lightning-button
                label="Update"
                variant="brand"
                icon-name="utility:save"
                icon-position="left"
                title="Save the formula to the record (verify first to enable)"
                onclick={handleUpdateOnclick}
                disabled={isUpdateDisabled}
                class="formula-builder-btn-update slds-m-right_xx-small"
              >
              </lightning-button>

              <lightning-button
                label="Cancel"
                variant="neutral"
                icon-name="utility:close"
                icon-position="left"
                title="Discard changes and return to view mode"
                onclick={handleCancelOnclick}
                disabled={isLoading}
                class="formula-builder-btn-cancel slds-m-right_xx-small"
              >
              </lightning-button>

              <lightning-button
                label="Verify Formula"
                variant="neutral"
                icon-name="utility:check"
                icon-position="left"
                title="Open the Verify Formula dialog to check syntax"
                onclick={handleVerifyOnclick}
                disabled={isLoading}
                class="formula-builder-btn-verify slds-m-right_xx-small"
              >
              </lightning-button>

              <lightning-button-icon
                icon-name="utility:refresh"
                variant="border-filled"
                alternative-text="Refresh"
                title="Reload formula value from record"
                onclick={handleRefresh}
                disabled={isLoading}
                class="formula-builder-btn-refresh"
              >
              </lightning-button-icon>
            </template>

          </div>
          <!-- /slot:actions -->

          <!-- ── Card body ──────────────────────────────────────────── -->
          <div class="formula-builder-content slds-p-around_medium">

            <!-- VIEW MODE -->
            <template if:false={isEditMode}>
              <div class="formula-builder-view">
                <template if:true={isConfigured}>
                  <div
                    class="formula-builder-view__row slds-grid slds-grid_vertical-align-start slds-wrap"
                  >
                    <div
                      class="formula-builder-view__label-col slds-col slds-size_2-of-12 slds-small-size_12-of-12"
                    >
                      <span
                        class="formula-builder-view__label slds-text-body_small slds-text-color_weak"
                      >
                        {fieldLabel}
                      </span>
                    </div>
                    <div
                      class="formula-builder-view__formula-col slds-col slds-size_10-of-12 slds-small-size_12-of-12"
                    >
                      <pre class="formula-builder-view__pre">
{currentFormulaValue}</pre
                      >
                    </div>
                  </div>
                </template>
                <template if:false={isConfigured}>
                  <p
                    class="formula-builder-view__hint slds-text-body_small slds-text-color_weak"
                  >
                    Set <strong>targetObjectApiName</strong> and
                    <strong>targetFieldApiName</strong> to load a formula.
                  </p>
                </template>
              </div>
            </template>
            <!-- /VIEW MODE -->

            <!-- EDIT MODE -->
            <template if:true={isEditMode}>
              <div class="formula-builder-edit">

                <!-- ── Row 1: Four insertion comboboxes ────────────── -->
                <div class="formula-builder-combobox-row slds-m-bottom_small">
                  <lightning-layout
                    multiple-rows="false"
                    pull-to-boundary="small"
                    class="formula-builder-combobox-layout"
                  >
                    <!-- Combobox 1: Formula Context (system variables + target SObject) -->
                    <lightning-layout-item
                      flexibility="auto"
                      padding="around-small"
                      class="formula-builder-combobox-item"
                    >
                      <lightning-combobox
                        label="Formula Context"
                        variant="label-stacked"
                        placeholder="Select an Option"
                        options={systemVariableOptions}
                        value={_selectedSystemVariable}
                        onchange={handleSystemVariableSelect}
                        disabled={isLoading}
                        class="formula-builder-combobox"
                      >
                      </lightning-combobox>
                    </lightning-layout-item>

                    <!-- Combobox 2: Fields (disabled until Step 1 is chosen) -->
                    <template if:true={isConfigured}>
                      <lightning-layout-item
                        flexibility="auto"
                        padding="around-small"
                        class="formula-builder-combobox-item"
                      >
                        <lightning-combobox
                          label="Fields"
                          variant="label-stacked"
                          placeholder={fieldsPlaceholder}
                          options={fieldOptions}
                          value={_selectedField}
                          onchange={handleFieldSelect}
                          disabled={isFieldsDisabled}
                          class="formula-builder-combobox"
                        >
                        </lightning-combobox>
                      </lightning-layout-item>
                    </template>

                    <!-- Combobox 3: Functions -->
                    <lightning-layout-item
                      flexibility="auto"
                      padding="around-small"
                      class="formula-builder-combobox-item"
                    >
                      <lightning-combobox
                        label="Functions"
                        variant="label-stacked"
                        placeholder="Select an Option"
                        options={functionOptions}
                        value={_selectedFunction}
                        onchange={handleFunctionSelect}
                        disabled={isLoading}
                        class="formula-builder-combobox"
                      >
                      </lightning-combobox>
                    </lightning-layout-item>

                    <!-- Combobox 4: Operators -->
                    <lightning-layout-item
                      flexibility="auto"
                      padding="around-small"
                      class="formula-builder-combobox-item"
                    >
                      <lightning-combobox
                        label="Operators"
                        variant="label-stacked"
                        placeholder="Select an Option"
                        options={operatorOptions}
                        value={_selectedOperator}
                        onchange={handleOperatorSelect}
                        disabled={isLoading}
                        class="formula-builder-combobox"
                      >
                      </lightning-combobox>
                    </lightning-layout-item>
                  </lightning-layout>
                </div>
                <!-- /combobox row -->

                <!-- ── Unified two-step indicator ──────────────────── -->
                <!-- Shows Step 1 hint OR token preview depending on state.
                     Collapsed entirely when no system variable is pending. -->
                <template if:true={hasPendingSystemVariable}>
                  <div
                    class="slds-box slds-theme_shade slds-grid slds-grid_vertical-align-center slds-m-bottom_small"
                  >
                    <div class="slds-col slds-grow">
                      <span
                        class="slds-text-body_small slds-text-color_weak slds-m-right_x-small"
                      >
                        <!-- Step 1: system variable chosen, waiting for field pick -->
                        <template if:false={hasPendingToken}>
                          Step 1 of 2 —
                          <code
                            class="slds-p-horizontal_xxx-small"
                            style="background: #eef1f6; border-radius: 2px"
                            >{pendingSystemVariableLabel}</code
                          >
                          selected. Now pick a <strong>Field</strong> to preview
                          the token.
                        </template>
                        <!-- Step 2: both chosen — preview the combined token -->
                        <template if:true={hasPendingToken}>
                          You have selected:
                          <code
                            class="slds-p-horizontal_xxx-small"
                            style="
                              background: #eef1f6;
                              color: #00396b;
                              border-radius: 2px;
                              font-weight: bold;
                            "
                            >{pendingToken}</code
                          >
                        </template>
                      </span>
                    </div>
                    <div
                      class="slds-col slds-no-flex slds-grid slds-grid_vertical-align-center"
                    >
                      <!-- Insert button — only when token is fully formed -->
                      <template if:true={hasPendingToken}>
                        <lightning-button
                          label="Insert"
                          variant="brand"
                          icon-name="utility:insert_tag_field"
                          icon-position="left"
                          size="small"
                          disabled={isLoading}
                          onclick={handleInsertToken}
                          class="slds-m-right_x-small"
                        >
                        </lightning-button>
                      </template>
                      <!-- Clear always available once a system variable is chosen -->
                      <lightning-button-icon
                        icon-name="utility:close"
                        size="small"
                        variant="bare"
                        title="Clear selection"
                        onclick={handleClearPendingSystemVariable}
                      >
                      </lightning-button-icon>
                    </div>
                  </div>
                </template>
                <!-- /two-step indicator -->

                <!-- ── Formula target label ────────────────────────── -->
                <p
                  class="formula-builder-target-label slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small"
                >
                  {formulaTargetLabel}
                </p>

                <!-- ── Formula textarea ────────────────────────────── -->
                <lightning-textarea
                  data-id="formulaTextarea"
                  label="Formula Editor"
                  variant="label-hidden"
                  value={currentFormulaValue}
                  onchange={handleFormulaChange}
                  rows="10"
                  placeholder="Enter or build your formula here…"
                  disabled={isLoading}
                  class="formula-builder-textarea"
                >
                </lightning-textarea>

                <!-- ── Verify hint ─────────────────────────────────── -->
                <p
                  class="formula-builder-verify-hint slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                >
                  <lightning-icon
                    icon-name="utility:info"
                    size="xx-small"
                    alternative-text="Info"
                    class="formula-builder-verify-hint__icon"
                  >
                  </lightning-icon>
                  Use <strong>Verify Formula</strong> to check syntax before
                  saving.
                </p>

              </div>
            </template>
            <!-- /EDIT MODE -->

          </div>
          <!-- /formula-builder-content -->

        </lightning-card>
      </div>
    </template>
    <!-- /isInitSuccess -->

    <!-- Verify Formula Modal -->
    <template if:true={isVerifyModalOpen}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-label="Verify Formula"
        class="slds-modal slds-fade-in-open formula-builder-modal"
      >
        <div class="slds-modal__container formula-builder-modal__container">
          <header class="slds-modal__header formula-builder-modal__header">
            <h2 class="slds-modal__title slds-hyphenate">Verify Formula</h2>
            <lightning-button-icon
              icon-name="utility:close"
              alternative-text="Close"
              title="Close"
              variant="bare-inverse"
              size="small"
              onclick={handleVerifyClose}
              class="formula-builder-modal__close-btn"
            >
            </lightning-button-icon>
          </header>

          <div
            class="slds-modal__content slds-p-around_medium formula-builder-modal__body"
          >
            <p
              class="formula-builder-modal__hint slds-text-body_small slds-text-color_weak slds-m-bottom_small"
            >
              Optionally enter a sample record Id, then click
              <strong>Verify</strong>. Only formula syntax is checked; the
              record Id is not required.
            </p>

            <lightning-input
              type="text"
              label="Sample Record ID (optional)"
              placeholder="e.g. a0B000000000001EAA"
              value={_verifyRecordId}
              onchange={handleVerifyRecordInput}
              disabled={isLoading}
              class="formula-builder-modal__record-input"
            >
            </lightning-input>

            <template if:true={hasVerifyModalResult}>
              <div class="formula-builder-modal__result slds-m-top_small">
                <template if:true={verifyModalIsValid}>
                  <div
                    class="formula-builder-result formula-builder-result--success slds-box slds-p-around_small"
                  >
                    <lightning-icon
                      icon-name="utility:success"
                      size="x-small"
                      alternative-text="Valid"
                      class="formula-builder-result__icon slds-m-right_x-small"
                    >
                    </lightning-icon>
                    <span
                      class="formula-builder-result__text slds-text-color_success"
                    >
                      Formula syntax is valid. You may now close and save.
                    </span>
                  </div>
                </template>

                <template if:true={verifyModalIsInvalid}>
                  <div
                    class="formula-builder-result formula-builder-result--error slds-box slds-p-around_small"
                  >
                    <lightning-icon
                      icon-name="utility:error"
                      size="x-small"
                      alternative-text="Invalid"
                      class="formula-builder-result__icon slds-m-right_x-small"
                    >
                    </lightning-icon>
                    <span
                      class="formula-builder-result__text slds-text-color_error"
                    >
                      {verifyModalResultMessage}
                    </span>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <footer class="slds-modal__footer">
            <lightning-button
              label="Close"
              variant="neutral"
              onclick={handleVerifyClose}
              class="slds-m-right_x-small"
            >
            </lightning-button>
            <lightning-button
              label="Verify"
              variant="brand"
              icon-name="utility:check"
              icon-position="left"
              title="Run formula syntax verification"
              disabled={isLoading}
              onclick={handleVerifyRecord}
            >
            </lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- /verify modal -->

  </div>
  <!-- /formula-builder-root -->
</template>
